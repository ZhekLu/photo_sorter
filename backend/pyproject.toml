[project]
name = "photo_sorter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ZhekLu" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "photo_sorter:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

